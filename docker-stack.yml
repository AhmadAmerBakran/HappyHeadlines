version: "3.8"

services:
  load-balancer:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - frontend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  article-service:
    image: happyheadlines/article-service:week38
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      ConnectionStrings__Africa: Host=africa-db;Port=5432;Database=happy_headlines_africa;Username=postgres;Password=happyheadlines_dev
      ConnectionStrings__Antarctica: Host=antarctica-db;Port=5432;Database=happy_headlines_antarctica;Username=postgres;Password=happyheadlines_dev
      ConnectionStrings__Asia: Host=asia-db;Port=5432;Database=happy_headlines_asia;Username=postgres;Password=happyheadlines_dev
      ConnectionStrings__Australia: Host=australia-db;Port=5432;Database=happy_headlines_australia;Username=postgres;Password=happyheadlines_dev
      ConnectionStrings__Europe: Host=europe-db;Port=5432;Database=happy_headlines_europe;Username=postgres;Password=happyheadlines_dev
      ConnectionStrings__NorthAmerica: Host=north-america-db;Port=5432;Database=happy_headlines_north_america;Username=postgres;Password=happyheadlines_dev
      ConnectionStrings__SouthAmerica: Host=south-america-db;Port=5432;Database=happy_headlines_south_america;Username=postgres;Password=happyheadlines_dev
      ConnectionStrings__Global: Host=global-db;Port=5432;Database=happy_headlines_global;Username=postgres;Password=happyheadlines_dev
    networks:
      - frontend
      - backend
      - observability
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first

  comment-service:
    image: happyheadlines/comment-service:week38
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: ingress
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      ConnectionStrings__Comments: Host=comment-db;Port=5432;Database=happy_headlines_comments;Username=postgres;Password=happyheadlines_dev
      Services__ProfanityService: http://profanity-service:8080/
    networks:
      - comment-data
      - moderation
      - observability
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  profanity-service:
    image: happyheadlines/profanity-service:week38
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      ConnectionStrings__Profanity: Host=profanity-db;Port=5432;Database=happy_headlines_profanity;Username=postgres;Password=happyheadlines_dev
    networks:
      - profanity-data
      - moderation
      - observability
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  draft-service:
    image: happyheadlines/draft-service:week38
    ports:
      - target: 8080
        published: 8082
        protocol: tcp
        mode: ingress
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      ConnectionStrings__Drafts: Host=draft-db;Port=5432;Database=happy_headlines_drafts;Username=postgres;Password=happyheadlines_dev
    networks:
      - draft-data
      - observability
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  observability:
    image: grafana/otel-lgtm:latest
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    volumes:
      - observability-data:/data
    networks:
      - observability
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  africa-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_headlines_africa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: happyheadlines_dev
    volumes:
      - africa-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  antarctica-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_headlines_antarctica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: happyheadlines_dev
    volumes:
      - antarctica-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  asia-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_headlines_asia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: happyheadlines_dev
    volumes:
      - asia-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  australia-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_headlines_australia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: happyheadlines_dev
    volumes:
      - australia-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  europe-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_headlines_europe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: happyheadlines_dev
    volumes:
      - europe-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  north-america-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_headlines_north_america
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: happyheadlines_dev
    volumes:
      - north-america-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  south-america-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_headlines_south_america
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: happyheadlines_dev
    volumes:
      - south-america-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  global-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_headlines_global
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: happyheadlines_dev
    volumes:
      - global-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  comment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_headlines_comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: happyheadlines_dev
    volumes:
      - comment-data-volume:/var/lib/postgresql/data
    networks:
      - comment-data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  profanity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_headlines_profanity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: happyheadlines_dev
    volumes:
      - profanity-data-volume:/var/lib/postgresql/data
    networks:
      - profanity-data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  draft-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happy_headlines_drafts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: happyheadlines_dev
    volumes:
      - draft-data-volume:/var/lib/postgresql/data
    networks:
      - draft-data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
  comment-data:
    driver: overlay
  profanity-data:
    driver: overlay
  moderation:
    driver: overlay
  draft-data:
    driver: overlay
  observability:
    driver: overlay

configs:
  nginx_config:
    file: ./infra/nginx/nginx.conf

volumes:
  africa-data:
  antarctica-data:
  asia-data:
  australia-data:
  europe-data:
  north-america-data:
  south-america-data:
  global-data:
  comment-data-volume:
  profanity-data-volume:
  draft-data-volume:
  observability-data:
