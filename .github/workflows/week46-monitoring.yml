name: Week 46 monitoring evidence

on:
  push:
    branches: [week46-compulsory]
    paths:
      - .github/workflows/week46-monitoring.yml
      - tools/week46-monitoring/**

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Run monitored Happy Headlines services
        run: docker compose -f tools/week46-monitoring/docker-compose.yml up -d --build

      - name: Prepare screenshot browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture real monitoring evidence
        run: node tools/week46-monitoring/capture.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happyheadlines-week46-monitoring
          path: docs/monitoring-week46/
          if-no-files-found: warn
          retention-days: 7

      - name: Save images on week 46 branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/monitoring-week46/
          git commit -m "Add monitoring screenshots from running services"
          git push origin HEAD:week46-compulsory

      - name: Print container diagnostics if needed
        if: failure()
        run: |
          docker compose -f tools/week46-monitoring/docker-compose.yml ps -a
          docker compose -f tools/week46-monitoring/docker-compose.yml logs --tail=70
