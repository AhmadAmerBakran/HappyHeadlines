name: Week 46 sustainability editor screenshots

on:
  push:
    branches: [week46-compulsory]
    paths:
      - .github/workflows/week46-editor.yml
      - tools/week46-sustainability/capture_editor.mjs

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Open repository in VS Code
        run: |
          docker run -d --name week46-vscode \
            -p 127.0.0.1:8443:8080 \
            -v "$GITHUB_WORKSPACE:/home/coder/project" \
            codercom/code-server:4.100.1 \
            --auth none --bind-addr 0.0.0.0:8080 /home/coder/project

      - name: Set up screenshot browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture the real editor
        run: node tools/week46-sustainability/capture_editor.mjs

      - name: Check screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          folder = Path('docs/week46-sustainability-editor')
          screenshots = sorted(folder.glob('*.png'))
          assert len(screenshots) == 3, [str(p) for p in screenshots]
          for screenshot in screenshots:
              data = screenshot.read_bytes()
              assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), screenshot
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == (1600, 900), screenshot
              assert screenshot.stat().st_size < 1000000, screenshot
              print(screenshot, screenshot.stat().st_size)
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happyheadlines-week46-editor
          path: docs/week46-sustainability-editor/
          if-no-files-found: warn
          retention-days: 14

      - name: Save screenshots on week 46 branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/week46-sustainability-editor/
          if ! git diff --cached --quiet; then
            git commit -m "Add real source editor screenshots for sustainability"
            git pull --rebase origin week46-compulsory
            git push origin HEAD:week46-compulsory
          else
            echo "Editor screenshots are already up to date."
          fi

      - name: Show code editor diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker logs week46-vscode --tail 120
