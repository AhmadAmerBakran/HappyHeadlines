name: Week 46 code checks

on:
  push:
    branches: [week46-compulsory]
    paths:
      - .github/workflows/week46-tests.yml
      - src/NewsletterService/**
      - src/SubscriberService/**
      - tests/**
      - HappyHeadlines.sln

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HappyHeadlines.sln

      - name: Build
        run: dotnet build HappyHeadlines.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HappyHeadlines.sln --configuration Release --no-build

      - name: Validate Docker configuration
        run: docker compose -f docker-stack.yml -f docker-stack.week40.yml -f docker-stack.week44.yml -f docker-stack.week45.yml config --quiet
