<text x="1700" y="475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#30343b" text-anchor="middle">Dashboards and alerts</text>
<text x="340" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6b7280" text-anchor="start">Week 38 monitoring addition: OpenTelemetry Collector inside HappyHeadlines; Grafana Cloud remains an external non-core system.</text>
