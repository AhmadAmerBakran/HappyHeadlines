<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4c566a"/></marker></defs>
<rect width="1800" height="1200" fill="#ffffff"/>
<text x="45" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1f2937" text-anchor="start">C4 Level 2 – Containers (Week 38 Monitoring)</text>
<rect x="35" y="170" width="230" height="105" rx="14" fill="#08427B" stroke="#2f2f2f" stroke-width="2"/>
<text x="150.0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">Publisher</text>
<text x="150.0" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">Publishes articles</text>
<rect x="35" y="470" width="230" height="105" rx="14" fill="#08427B" stroke="#2f2f2f" stroke-width="2"/>
<text x="150.0" y="500" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">Reader</text>
<text x="150.0" y="525" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">Reads articles and</text>
<text x="150.0" y="543" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">comments</text>
<rect x="1500" y="100" width="260" height="115" rx="14" fill="#08427B" stroke="#2f2f2f" stroke-width="2"/>
<text x="1630.0" y="130" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">Development / Ops Team</text>
<text x="1630.0" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">Uses dashboards and alerts</text>
<text x="1630.0" y="173" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">during incidents</text>
<rect x="1500" y="735" width="260" height="145" rx="14" fill="#777777" stroke="#2f2f2f" stroke-width="2"/>
<text x="1630.0" y="765" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">Grafana Cloud</text>
<text x="1630.0" y="790" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">Hosted metrics, logs, traces,</text>
<text x="1630.0" y="808" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">dashboards and alerting</text>
<rect x="310" y="95" width="1130" height="1025" rx="18" fill="#f8fbff" stroke="#1168BD" stroke-width="3"/>
<text x="340" y="130" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1168BD" text-anchor="start">HappyHeadlines</text>
<rect x="390" y="175" width="300" height="110" rx="14" fill="#438DD5" stroke="#2f2f2f" stroke-width="2"/>
<text x="540.0" y="205" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">Nginx Load Balancer</text>
<text x="540.0" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">[Container: nginx] Public entry</text>
<text x="540.0" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">point for article traffic.</text>
<rect x="390" y="355" width="300" height="130" rx="14" fill="#438DD5" stroke="#2f2f2f" stroke-width="2"/>
<text x="540.0" y="385" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">Article Service</text>
<text x="540.0" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">[Container: ASP.NET Core] 3</text>
<text x="540.0" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">replicas. CRUD API and geographic</text>
<text x="540.0" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">shard routing.</text>
<rect x="380" y="595" width="320" height="155" rx="14" fill="#2E7D32" stroke="#2f2f2f" stroke-width="2"/>
<text x="540.0" y="625" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">Article PostgreSQL Shards</text>
<text x="540.0" y="650" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">[Databases: PostgreSQL] 8 shards:</text>
<text x="540.0" y="668" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">Africa, Antarctica, Asia, Australia,</text>
<text x="540.0" y="686" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">Europe, North America, South America</text>
<text x="540.0" y="704" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">and Global.</text>
<rect x="830" y="280" width="320" height="135" rx="14" fill="#438DD5" stroke="#2f2f2f" stroke-width="2"/>
<text x="990.0" y="310" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">Comment Service</text>
<text x="990.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">[Container: ASP.NET Core] Stores</text>
<text x="990.0" y="353" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">comments and calls Profanity Service</text>
<text x="990.0" y="371" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">through a Polly circuit breaker.</text>
<rect x="830" y="500" width="320" height="120" rx="14" fill="#438DD5" stroke="#2f2f2f" stroke-width="2"/>
<text x="990.0" y="530" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">Profanity Service</text>
<text x="990.0" y="555" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">[Container: ASP.NET Core] Internal</text>
<text x="990.0" y="573" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">comment-moderation service.</text>
<rect x="770" y="700" width="255" height="120" rx="14" fill="#2E7D32" stroke="#2f2f2f" stroke-width="2"/>
<text x="897.5" y="730" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">Comment Database</text>
<text x="897.5" y="755" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">[Database: PostgreSQL] Owned by</text>
<text x="897.5" y="773" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">Comment Service.</text>
<rect x="1080" y="700" width="255" height="120" rx="14" fill="#2E7D32" stroke="#2f2f2f" stroke-width="2"/>
<text x="1207.5" y="730" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">Profanity Database</text>
<text x="1207.5" y="755" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">[Database: PostgreSQL] Owned by</text>
<text x="1207.5" y="773" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">Profanity Service.</text>
<rect x="650" y="925" width="450" height="135" rx="14" fill="#D97706" stroke="#2f2f2f" stroke-width="2"/>
<text x="875.0" y="955" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">OpenTelemetry Collector</text>
<text x="875.0" y="980" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">[Container] Receives metrics, structured logs and</text>
<text x="875.0" y="998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">distributed traces from the application and forwards</text>
<text x="875.0" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle">them to Grafana Cloud.</text>
