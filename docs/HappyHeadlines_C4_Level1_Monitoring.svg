<text x="452.5" y="288.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#30343b" text-anchor="middle">Publishes articles</text>
<line x1="330" y1="590" x2="575" y2="455" stroke="#4c566a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
<text x="452.5" y="538.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#30343b" text-anchor="middle">Reads and comments</text>
<line x1="965" y1="410" x2="1180" y2="450" stroke="#4c566a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
<text x="1072.5" y="418.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#30343b" text-anchor="middle">Metrics, logs and traces</text>
<line x1="1325" y1="380" x2="1190" y2="210" stroke="#4c566a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
<text x="1295.5" y="287.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#30343b" text-anchor="middle">Dashboards and alerts</text>
<line x1="1030" y1="150" x2="935" y2="315" stroke="#4c566a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
<text x="937.5" y="224.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#30343b" text-anchor="middle">Investigates incidents</text>
<text x="50" y="790" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#4b5563" text-anchor="start">Monitoring is treated as a supporting capability and kept outside the core product.</text>
<rect x="50" y="820" width="18" height="18" fill="#08427B"/><text x="78" y="835" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Person</text>
<rect x="180" y="820" width="18" height="18" fill="#1168BD"/><text x="208" y="835" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Software system</text>
<rect x="365" y="820" width="18" height="18" fill="#777777"/><text x="393" y="835" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="start">External system</text>
</svg>